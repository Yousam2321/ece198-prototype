name: Test and package Solution B firmware
on:
  pull_request:
    paths:
      - 'HoldStation/**'
      - 'tests/**'
      - 'docs/CHEST_PRESS.md'
      - '.github/workflows/chest-press-firmware.yml'
  push:
    branches: [main]
    paths:
      - 'HoldStation/**'
      - 'tests/**'
      - 'docs/CHEST_PRESS.md'
      - '.github/workflows/chest-press-firmware.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the actual station controller and rep logic
        run: python tests/run_tests.py
      - name: Test hold and rep CSV exports
        run: python -m unittest discover -s tests -p test_export_sessions.py
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Uno core and display library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib update-index
          arduino-cli lib install U8g2
      - name: Compile Uno with SH1106 OLED
        run: arduino-cli compile --fqbn arduino:avr:uno --build-path build/sh1106 HoldStation
      - name: Compile Uno with SSD1306 OLED
        run: arduino-cli compile --fqbn arduino:avr:uno --build-property compiler.cpp.extra_flags=-DOLED_SH1106=0 --build-path build/ssd1306 HoldStation
      - name: Compile Uno without OLED
        run: arduino-cli compile --fqbn arduino:avr:uno --build-property compiler.cpp.extra_flags=-DENABLE_OLED=0 --build-path build/serial HoldStation
      - uses: actions/upload-artifact@v4
        with:
          name: ECE198-Complete-Project-B2.6
          path: |
            HoldStation/
            WearableMonitor/
            desktop/
            tools/
            tests/
            docs/
            README.md
            VALIDATION.md
            requirements.txt
          retention-days: 30

name: Build Windows results app
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/export_sessions.py'
      - 'tests/test_evaluation.py'
      - '.github/workflows/windows-app.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'tools/export_sessions.py'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyserial==3.5 pyinstaller==6.22.0
      - name: Test evaluator and serial parser
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: GUI smoke test
        run: python desktop/results_app.py --smoke-test
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ECE198_Results --paths tools --paths desktop desktop/results_app.py
      - name: Test packaged executable
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\ECE198_Results.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Packaged app smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ECE198-Results-Windows
          path: |
            dist/ECE198_Results.exe
            desktop/README.txt
          retention-days: 30
